services:
  eldf-api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: eldf-api
    restart: unless-stopped
    env_file:
      - .env
    environment:
      ELDF_URLS: http://0.0.0.0:8001
      ELDF_DATA_DIR: /data
      ASPNETCORE_ENVIRONMENT: Production
    expose:
      - "8001"
    volumes:
      - eldf-data:/data
    networks:
      - eldf-net

  caddy:
    image: caddy:2.11.4-alpine@sha256:6aeddd44c3078b0f9a35206472a11420648a79c184603ef95957d0a20044cb2b
    container_name: eldf-caddy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - eldf-api
    networks:
      - eldf-net

networks:
  eldf-net:
    driver: bridge

volumes:
  eldf-data:
  caddy-data:
  caddy-config:
