<div class="page-heading"><div><div class="eyebrow">ACCOUNT SECURITY</div><h1>{{ tr.t('Change password') }}</h1></div></div>
<form class="workspace-card auth-card" (ngSubmit)="submit()">
  <div class="field"><label>{{ tr.t('Current password') }}</label><input type="password" [(ngModel)]="currentPassword" name="currentPassword" autocomplete="current-password" required /></div>
  <div class="field"><label>{{ tr.t('New password') }}</label><input type="password" [(ngModel)]="newPassword" name="newPassword" minlength="10" autocomplete="new-password" required /><small>{{ tr.t('Use at least 10 characters.') }}</small></div>
  <div class="field"><label>{{ tr.t('Confirm password') }}</label><input type="password" [(ngModel)]="confirmPassword" name="confirmPassword" minlength="10" autocomplete="new-password" required /></div>
  @if (error) { <p class="form-error">{{ error }}</p> }
  @if (message) { <p class="status-pill approved recovery-success">{{ message }}</p> }
  <div class="form-footer"><button class="primary-button" [disabled]="loading">{{ tr.t('Save new password') }}</button><a routerLink="/dashboard" class="text-button">{{ tr.t('Back to workspace') }}</a></div>
</form>
