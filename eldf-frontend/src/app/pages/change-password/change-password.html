<div class="page-heading"><div><div class="eyebrow">ACCOUNT SECURITY</div><h1>{{ tr.t('Change password') }}</h1></div></div>
<form class="workspace-card auth-card" (ngSubmit)="submit()">
  <div class="field">
    <label>{{ tr.t('Current password') }}</label>
    <div class="password-field">
      <input [type]="showCurrentPassword ? 'text' : 'password'" [(ngModel)]="currentPassword" name="currentPassword" autocomplete="current-password" required />
      <button type="button" class="password-toggle" (click)="showCurrentPassword = !showCurrentPassword" [attr.aria-pressed]="showCurrentPassword" [attr.aria-label]="tr.t(showCurrentPassword ? 'Hide password' : 'Show password')">
        @if (showCurrentPassword) {
          <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M3 3l18 18M10.6 10.6a2 2 0 0 0 2.8 2.8M9.9 5.2A11.8 11.8 0 0 1 12 5c5.2 0 9 4.2 10 7-.4 1.1-1.2 2.3-2.3 3.3M6.2 6.2C3.9 7.6 2.5 9.6 2 12c1 2.8 4.8 7 10 7 1.4 0 2.7-.3 3.8-.8" /></svg>
        } @else {
          <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12Z" /><circle cx="12" cy="12" r="3" /></svg>
        }
      </button>
    </div>
  </div>
  <div class="field">
    <label>{{ tr.t('New password') }}</label>
    <div class="password-field">
      <input [type]="showNewPassword ? 'text' : 'password'" [(ngModel)]="newPassword" name="newPassword" minlength="10" autocomplete="new-password" required />
      <button type="button" class="password-toggle" (click)="showNewPassword = !showNewPassword" [attr.aria-pressed]="showNewPassword" [attr.aria-label]="tr.t(showNewPassword ? 'Hide password' : 'Show password')">
        @if (showNewPassword) {
          <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M3 3l18 18M10.6 10.6a2 2 0 0 0 2.8 2.8M9.9 5.2A11.8 11.8 0 0 1 12 5c5.2 0 9 4.2 10 7-.4 1.1-1.2 2.3-2.3 3.3M6.2 6.2C3.9 7.6 2.5 9.6 2 12c1 2.8 4.8 7 10 7 1.4 0 2.7-.3 3.8-.8" /></svg>
        } @else {
          <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12Z" /><circle cx="12" cy="12" r="3" /></svg>
        }
      </button>
    </div>
    <small>{{ tr.t('Use at least 10 characters.') }}</small>
  </div>
  <div class="field">
    <label>{{ tr.t('Confirm password') }}</label>
    <div class="password-field">
      <input [type]="showConfirmPassword ? 'text' : 'password'" [(ngModel)]="confirmPassword" name="confirmPassword" minlength="10" autocomplete="new-password" required />
      <button type="button" class="password-toggle" (click)="showConfirmPassword = !showConfirmPassword" [attr.aria-pressed]="showConfirmPassword" [attr.aria-label]="tr.t(showConfirmPassword ? 'Hide password' : 'Show password')">
        @if (showConfirmPassword) {
          <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M3 3l18 18M10.6 10.6a2 2 0 0 0 2.8 2.8M9.9 5.2A11.8 11.8 0 0 1 12 5c5.2 0 9 4.2 10 7-.4 1.1-1.2 2.3-2.3 3.3M6.2 6.2C3.9 7.6 2.5 9.6 2 12c1 2.8 4.8 7 10 7 1.4 0 2.7-.3 3.8-.8" /></svg>
        } @else {
          <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12Z" /><circle cx="12" cy="12" r="3" /></svg>
        }
      </button>
    </div>
  </div>
  @if (error) { <p class="form-error">{{ error }}</p> }
  @if (message) { <p class="status-pill approved recovery-success">{{ message }}</p> }
  <div class="form-footer"><button class="primary-button" [disabled]="loading">{{ tr.t('Save new password') }}</button><a routerLink="/dashboard" class="text-button">{{ tr.t('Back to workspace') }}</a></div>
</form>
