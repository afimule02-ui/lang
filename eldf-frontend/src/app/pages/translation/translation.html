<div class="page-heading">
  <div><div class="eyebrow">CONTRIBUTE · 05</div><h1>{{ tr.t('Translation') }}</h1></div>
</div>

@if (success) {
  <div class="demo-callout">
    ✅ Your recording, transcript, and translation were submitted for review.
    <br><a routerlink="/dashboard" style="color:var(--green)">Go to dashboard →</a>
  </div>
} @else {
  <section class="workspace-card">
    <div class="field">
      <label>{{ tr.t('Transcript') }}</label>
      <textarea [value]="transcript" readonly rows="5"></textarea>
    </div>
    <div class="field">
      <label>{{ tr.t('Translation') }}</label>
      <textarea [(ngModel)]="translation" name="translation" rows="5"
        placeholder="Translate the transcript while keeping its meaning."></textarea>
    </div>
    <div class="field">
      <label>{{ tr.t('Notes') }}</label>
      <textarea [(ngModel)]="notes" name="notes" rows="3"></textarea>
    </div>
    @if (error) { <div class="form-error">{{ error }}</div> }
    <div class="form-footer">
      <button class="primary-button" (click)="submit()" [disabled]="loading">
        {{ tr.t('Submit for review') }}
      </button>
    </div>
  </section>
}
