<div class="page-heading">
  <div><div class="eyebrow">CONTRIBUTE · 05</div><h1>{{ tr.t('Translation') }}</h1></div>
</div>

@if (success) {
  <div class="status-pill approved" role="status" aria-live="polite">
    ✅ {{ tr.t('Your recording, transcript, and translation were sent for review.') }}
    <br><a routerLink="/dashboard" style="color:var(--green)">{{ tr.t('Go to dashboard') }} →</a>
  </div>
} @else {
  @if (capture.storageWarning()) { <p class="form-error" role="alert">{{ tr.t(capture.storageWarning()) }}</p> }
  <section class="workspace-card">
    <div class="field">
      <label>{{ tr.t('Transcript') }}</label>
      <textarea [value]="transcript" readonly rows="5"></textarea>
    </div>
    <div class="field">
      <label>{{ tr.t('Translation') }}</label>
      <textarea [ngModel]="translation" (ngModelChange)="saveTranslation($event)" name="translation" rows="5"
        placeholder="Translate the transcript while keeping its meaning."></textarea>
    </div>
    @if (error) { <div class="form-error">{{ error }}</div> }
    <div class="form-footer">
      <button class="primary-button" (click)="submit()" [disabled]="loading">
        {{ tr.t('Submit for review') }}
      </button>
    </div>
  </section>
}
