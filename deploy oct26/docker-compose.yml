services:
  eldf-api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: eldf-api
    restart: unless-stopped
    env_file:
      - .env
    environment:
      ELDF_URLS: http://0.0.0.0:8001
      ELDF_DATA_DIR: /data
      ASPNETCORE_ENVIRONMENT: Production
    ports:
      - "8001:8001"
    volumes:
      - eldf-data:/data
    networks:
      - eldf-net

  nginx:
    image: nginx:alpine
    container_name: eldf-nginx
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - eldf-api
    networks:
      - eldf-net

networks:
  eldf-net:
    driver: bridge

volumes:
  eldf-data:
